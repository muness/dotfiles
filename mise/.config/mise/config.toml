fd = "latest"
bat = "latest"
ripgrep = "latest"
zoxide = "latest"
direnv = "latest"
sccache = "latest"
uv = "latest"
"vfox:jdx/vfox-1password" = "latest"
gh = "latest"
jq = "latest"
shellcheck = "latest"
shfmt = "latest"
gitleaks = "latest"

# Dev and infra tools that Homebrew used to carry. All ship linux-arm64 builds.
marksman = "latest"
terraform = "latest"
typst = "latest"
d2 = "latest"
cloudflared = "latest"
coder = "latest"
java = ["temurin-21", "temurin-17"]
