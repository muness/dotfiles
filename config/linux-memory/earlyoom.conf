[Service]
# Act on physical-memory pressure even when compressed swap has space left.
# Ask a process to exit at 4 GiB available and escalate at 2 GiB.
ExecStart=
ExecStart=/usr/bin/earlyoom -M 4194304,2097152 -s 100,100 -r 60 --ignore-root-user --prefer '^(ld|ld.bfd|ld.lld|rust-lld|rustc|cc1|cc1plus)$' --avoid '^(cosmic-comp|cosmic-session|Hyprland|quickshell|pipewire|pipewire-pulse|wireplumber|ChatGPT|chrome|browserclaw|obsidian)$'
