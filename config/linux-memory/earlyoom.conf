[Service]
# Act on physical-memory pressure even when compressed swap has space left.
# Ask a process to exit below 10%; kill below 5% if it cannot exit promptly.
ExecStart=
ExecStart=/usr/bin/earlyoom -m 10,5 -s 100,100 -r 60 --ignore-root-user --prefer '^(ld|ld.bfd|ld.lld|rust-lld|rustc|cc1|cc1plus)$' --avoid '^(cosmic-comp|cosmic-session|ChatGPT|chrome|obsidian)$'
